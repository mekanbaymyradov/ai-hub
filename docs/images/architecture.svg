<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 382" width="1000" height="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>AI-Hub architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ab7df8"/>
    </marker>
  </defs>

  <!-- A dark card, like the screenshots, so the diagram reads the same in light and dark themes. -->
  <rect x="0.5" y="0.5" width="999" height="381" rx="12" fill="#121212" stroke="#333338"/>

  <!-- Top: the request path in -->
  <rect x="20" y="20" width="160" height="56" rx="8" fill="#1e1e21" stroke="#333338" stroke-width="1.5"/>
  <text x="100" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Web client</text>
  <text x="100" y="62" text-anchor="middle" font-size="12" fill="#a1a1aa">React</text>

  <rect x="220" y="20" width="160" height="56" rx="8" fill="#1e1e21" stroke="#333338" stroke-width="1.5"/>
  <text x="300" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Caddy</text>
  <text x="300" y="62" text-anchor="middle" font-size="12" fill="#a1a1aa">HTTPS, reverse proxy</text>

  <line x1="180" y1="48" x2="220" y2="48" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="76" x2="300" y2="150" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Middle: the services -->
  <rect x="20" y="150" width="160" height="56" rx="8" fill="#1e1e21" stroke="#333338" stroke-width="1.5"/>
  <text x="100" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Scheduler</text>
  <text x="100" y="192" text-anchor="middle" font-size="12" fill="#a1a1aa">hourly cleanup</text>

  <rect x="220" y="150" width="160" height="56" rx="8" fill="#0c2340" stroke="#4493f8" stroke-width="1.5"/>
  <text x="300" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">API</text>
  <text x="300" y="192" text-anchor="middle" font-size="12" fill="#a1a1aa">FastAPI + Pydantic AI</text>

  <rect x="420" y="150" width="160" height="56" rx="8" fill="#1e1e21" stroke="#333338" stroke-width="1.5"/>
  <text x="500" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">LLM providers</text>
  <text x="500" y="192" text-anchor="middle" font-size="12" fill="#a1a1aa">Groq, Mistral, …</text>

  <rect x="620" y="150" width="160" height="56" rx="8" fill="#241a3d" stroke="#a371f7" stroke-width="1.5"/>
  <text x="700" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Logfire</text>
  <text x="700" y="192" text-anchor="middle" font-size="12" fill="#a1a1aa">traces, logs, metrics</text>

  <rect x="820" y="150" width="160" height="56" rx="8" fill="#1e1e21" stroke="#333338" stroke-width="1.5"/>
  <text x="900" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">OTel Collector</text>
  <text x="900" y="192" text-anchor="middle" font-size="12" fill="#a1a1aa">Docker container metrics</text>

  <line x1="380" y1="178" x2="420" y2="178" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340,150 V118 H700 V150" fill="none" stroke="#ab7df8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-purple)"/>
  <text x="520" y="111" text-anchor="middle" font-size="12" fill="#ab7df8">telemetry</text>
  <line x1="820" y1="178" x2="780" y2="178" stroke="#ab7df8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-purple)"/>
  <!-- Solid: what Logfire sends back, the live prompt and Fleet's settings. -->
  <path d="M700,206 V232 H340 V206" fill="none" stroke="#ab7df8" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="520" y="226" text-anchor="middle" font-size="12" fill="#ab7df8">prompt, Fleet policy</text>

  <!-- Bottom: the data stores -->
  <rect x="10" y="258" width="580" height="104" rx="10" fill="none" stroke="#333338" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="22" y="276" font-size="12" font-weight="600" fill="#a1a1aa">Data</text>

  <line x1="100" y1="206" x2="100" y2="258" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="206" x2="300" y2="258" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M20,294 V340 A80,8 0 0 0 180,340 V294" fill="#1e1e21" stroke="#5b5b63" stroke-width="1.5"/>
  <ellipse cx="100" cy="294" rx="80" ry="8" fill="#1e1e21" stroke="#5b5b63" stroke-width="1.5"/>
  <text x="100" y="322" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">PostgreSQL</text>
  <text x="100" y="339" text-anchor="middle" font-size="12" fill="#a1a1aa">database</text>

  <path d="M220,294 V340 A80,8 0 0 0 380,340 V294" fill="#1e1e21" stroke="#5b5b63" stroke-width="1.5"/>
  <ellipse cx="300" cy="294" rx="80" ry="8" fill="#1e1e21" stroke="#5b5b63" stroke-width="1.5"/>
  <text x="300" y="322" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Redis</text>
  <text x="300" y="339" text-anchor="middle" font-size="12" fill="#a1a1aa">sessions, rate limits</text>

  <path d="M420,294 V340 A80,8 0 0 0 580,340 V294" fill="#1e1e21" stroke="#5b5b63" stroke-width="1.5"/>
  <ellipse cx="500" cy="294" rx="80" ry="8" fill="#1e1e21" stroke="#5b5b63" stroke-width="1.5"/>
  <text x="500" y="322" text-anchor="middle" font-size="14" font-weight="600" fill="#f4f4f5">Cloudflare R2</text>
  <text x="500" y="339" text-anchor="middle" font-size="12" fill="#a1a1aa">file storage</text>
</svg>
